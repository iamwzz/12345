<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奶茶日记 🧋</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      :root {
        --primary: #84CBAA;
        --primary-light: #B9E2CE;
        --primary-dark: #549B76;
        --accent: #FFB29A;
        --accent-light: #FFD8CC;
        --bg-warm: #F6FBFA;
        --bg-card: #FFFFFF;
        --text-dark: #3A4B43;
        --text-mid: #6E8076;
        --text-light: #A4B3AB;
        --success: #5CB488;
        --gradient-main: linear-gradient(135deg, #99D9BA 0%, #70C79D 100%);
        --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.05);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans SC", Arial, sans-serif;
      }

      body {
        background-color: var(--bg-warm);
        color: var(--text-dark);
        min-height: 100vh;
      }

      /* ── Header ── */
      .hero-header {
        background: var(--gradient-main);
        position: relative;
        overflow: hidden;
        padding: 48px 24px 28px;
      }

      .hero-header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -20%;
        width: 400px;
        height: 400px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
      }

      .hero-header::after {
        content: '';
        position: absolute;
        bottom: -30%;
        left: -10%;
        width: 300px;
        height: 300px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 50%;
      }

      .header-inner {
        max-width: 520px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header-left .logo-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }

      .header-left .logo-row h1 {
        font-size: 22px;
        font-weight: 800;
        color: #fff;
        letter-spacing: 1px;
      }

      .header-left .date-str {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.8);
      }

      .header-right {
        text-align: right;
        color: #fff;
      }

      .header-right .label {
        font-size: 11px;
        opacity: 0.75;
        margin-bottom: 2px;
      }

      .header-right .big-num {
        font-size: 44px;
        font-weight: 800;
        line-height: 1;
      }

      .header-right .unit {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 2px;
      }

      .record-btn.animate-pop {
        animation: popEffect 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes popEffect {
        0% {
          transform: scale(1);
        }

        30% {
          transform: scale(1.18);
        }

        60% {
          transform: scale(0.93);
        }

        80% {
          transform: scale(1.06);
        }

        100% {
          transform: scale(1);
        }
      }

      .pulse-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 64px;
        height: 64px;
        border-radius: 16px;
        border: 3px solid rgba(132, 203, 170, 0.45);
        animation: pulseRing 2s ease-out infinite;
        pointer-events: none;
      }

      @keyframes pulseRing {
        0% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.8;
        }

        100% {
          transform: translate(-50%, -50%) scale(1.9);
          opacity: 0;
        }
      }

      .cup-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 4px;
        min-height: 32px;
        align-items: center;
      }

      .cup-icon {
        font-size: 26px;
        animation: cupAppear 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      @keyframes cupAppear {
        from {
          transform: scale(0) rotate(-20deg);
          opacity: 0;
        }

        to {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      /* ── 通用内容区 ── */
      .content-wrap {
        max-width: 520px;
        margin: 0 auto;
        padding: 0 16px 32px;
      }

      /* ── section title ── */
      .section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 700;
        color: var(--text-dark);
        margin: 20px 0 12px;
      }

      .section-title::before {
        content: '';
        width: 4px;
        height: 18px;
        background: var(--gradient-main);
        border-radius: 4px;
        flex-shrink: 0;
      }

      /* ── 卡片 ── */
      .card {
        background: var(--bg-card);
        border-radius: 20px;
        box-shadow: var(--shadow-card);
        border: 1px solid rgba(132, 203, 170, 0.15);
      }

      /* ── 日历 ── */
      .calendar-card {
        padding: 20px 16px 16px;
      }

      .cal-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .cal-nav-title {
        text-align: center;
      }

      .cal-nav-title .main {
        font-size: 17px;
        font-weight: 700;
        color: var(--text-dark);
      }

      .cal-nav-title .sub {
        font-size: 11px;
        color: var(--text-light);
        margin-top: 2px;
      }

      .month-nav-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid rgba(132, 203, 170, 0.2);
        background: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
        transition: all 0.2s;
        font-size: 13px;
      }

      .month-nav-btn:hover {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .month-nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
      }

      .cal-week-hd {
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        padding: 6px 2px;
        color: var(--text-light);
      }

      .cal-week-hd.weekend {
        color: #FF8F7D;
      }

      .calendar-day {
        aspect-ratio: 1;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.18s ease;
        font-size: 13px;
        font-weight: 500;
        min-height: 40px;
        user-select: none;
      }

      .calendar-day:hover:not(.empty):not(.other-month) {
        background: rgba(132, 203, 170, 0.1);
        transform: scale(1.06);
      }

      .calendar-day.today {
        border: 2px solid var(--primary);
        color: var(--primary-dark);
        font-weight: 700;
        position: relative;
        z-index: 1;
      }

      /* 今天有记录时，边框颜色调亮以便看清 */
      .calendar-day.today.has-record-1,
      .calendar-day.today.has-record-2,
      .calendar-day.today.has-record-3 {
        border-color: white;
        box-shadow: 0 0 0 2px var(--primary);
        color: white;
      }

      .calendar-day.no-record {
        background: linear-gradient(135deg, #F0F8F5, #E1F0E9);
        color: #7DB59B;
        font-weight: 600;
      }

      .calendar-day.has-record-1 {
        background: linear-gradient(135deg, #FFF0EC, #FFDFD6);
        color: #E8836A;
        font-weight: 600;
      }

      .calendar-day.has-record-2 {
        background: linear-gradient(135deg, #FFBEA8, #FF9E7A);
        color: white;
        font-weight: 700;
      }

      .calendar-day.has-record-3 {
        background: linear-gradient(135deg, #FF956C, #F46F41);
        color: white;
        font-weight: 700;
      }

      .calendar-day.other-month {
        color: #C6D4CE;
        cursor: default;
      }

      .day-num {
        line-height: 1;
      }

      .day-count {
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
        margin-top: 2px;
        opacity: 0.85;
      }

      .calendar-day.has-record-2 .day-count,
      .calendar-day.has-record-3 .day-count {
        color: rgba(255, 255, 255, 0.9);
      }

      /* 图例 */
      .legend-row {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        padding: 12px 4px 0;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .legend-dot {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        flex-shrink: 0;
      }

      .legend-dot.today-dot {
        background: white;
        border: 2px solid var(--primary);
      }

      .legend-dot.low-dot {
        background: linear-gradient(135deg, #EFFFF6, #D4EEDF);
      }

      .legend-dot.high-dot {
        background: linear-gradient(135deg, #FFE1D6, #FFBCA6);
      }

      .legend-item span {
        font-size: 11px;
        color: var(--text-light);
      }

      /* ── 看板 ── */
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
      }

      .stat-card {
        border-radius: 16px;
        padding: 18px 16px;
        position: relative;
        overflow: hidden;
        transition: transform 0.2s;
      }

      .stat-card:hover {
        transform: translateY(-3px);
      }

      .stat-card.week-card {
        background: linear-gradient(135deg, #99D9BA, #70C79D);
      }

      .stat-card.month-card {
        background: linear-gradient(135deg, #FFD2C2, #FFB29A);
      }

      .stat-card .deco1 {
        position: absolute;
        top: -18px;
        right: -18px;
        width: 88px;
        height: 88px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
      }

      .stat-card .deco2 {
        position: absolute;
        bottom: -24px;
        right: 16px;
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
      }

      .stat-card .inner {
        position: relative;
        z-index: 1;
      }

      .stat-card .s-icon {
        font-size: 13px;
        opacity: 0.82;
        color: white;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .stat-card .s-num {
        font-size: 40px;
        font-weight: 800;
        color: white;
        line-height: 1;
      }

      .stat-card .s-unit {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.75);
        margin-top: 4px;
      }

      .stat-card .s-range {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 3px;
      }

      /* 月小结 */
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 18px 16px;
      }

      .summary-item {
        text-align: center;
        border-radius: 14px;
        padding: 14px 8px;
      }

      .summary-item.s1 {
        background: #FFF5F0;
      }

      .summary-item.s2 {
        background: #F5F0FF;
      }

      .summary-item.s3 {
        background: #F0FFF8;
      }

      .summary-item .s-big {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .summary-item.s1 .s-big {
        color: var(--primary);
      }

      .summary-item.s2 .s-big {
        color: var(--accent);
      }

      .summary-item.s3 .s-big {
        color: var(--success);
      }

      .summary-item .s-label {
        font-size: 11px;
        color: var(--text-light);
      }

      /* 周柱状图 */
      .bar-card {
        padding: 18px 16px;
      }

      .bar-card .bar-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-mid);
        margin-bottom: 14px;
      }

      .week-bar-wrap {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 80px;
      }

      .week-bar-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        height: 100%;
        justify-content: flex-end;
      }

      .week-bar {
        width: 100%;
        border-radius: 6px 6px 0 0;
        background: linear-gradient(180deg, #FF9E7A, #FFD2C2);
        transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        min-height: 4px;
      }

      .week-bar.today-bar {
        background: linear-gradient(180deg, #70C79D, #AEEBD0);
      }

      .week-bar-label {
        font-size: 11px;
        color: var(--text-light);
        font-weight: 500;
      }

      .week-bar-label.today-label {
        color: var(--accent);
        font-weight: 700;
      }

      .week-bar-count {
        font-size: 11px;
        color: var(--text-mid);
        font-weight: 700;
        min-height: 14px;
      }

      /* 小贴士 */
      .tip-box {
        border-radius: 16px;
        padding: 14px 16px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        background: linear-gradient(135deg, #F0FAF5, #E5F5EC);
        margin-top: 12px;
      }

      .tip-box .tip-icon {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: rgba(132, 203, 170, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 14px;
        color: var(--primary);
      }

      .tip-box .tip-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--primary-dark);
        margin-bottom: 3px;
      }

      .tip-box .tip-body {
        font-size: 11px;
        color: var(--text-mid);
        line-height: 1.6;
      }

      /* ── 浮动emoji ── */
      .floating-emoji {
        position: fixed;
        font-size: 24px;
        pointer-events: none;
        animation: floatUp 1.5s ease-out forwards;
        z-index: 9999;
      }

      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(0deg);
        }

        50% {
          opacity: 0.8;
          transform: translateY(-60px) scale(1.3) rotate(15deg);
        }

        100% {
          opacity: 0;
          transform: translateY(-120px) scale(0.5) rotate(-15deg);
        }
      }

      /* ── Toast ── */
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-80px);
        background: var(--gradient-main);
        color: white;
        padding: 11px 22px;
        border-radius: 50px;
        font-size: 13px;
        font-weight: 500;
        z-index: 10000;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        white-space: nowrap;
        box-shadow: 0 8px 24px rgba(132, 203, 170, 0.3);
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
      }

      /* ── 弹窗 ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(45, 32, 22, 0.5);
        backdrop-filter: blur(8px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .modal-overlay.show {
        opacity: 1;
        pointer-events: all;
      }

      .modal-content {
        background: white;
        border-radius: 24px;
        padding: 28px 28px 24px;
        width: 88%;
        max-width: 340px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
        transform: scale(0.9) translateY(20px);
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .modal-overlay.show .modal-content {
        transform: scale(1) translateY(0);
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .modal-head .m-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-dark);
      }

      .modal-head .m-date {
        font-size: 12px;
        color: var(--text-light);
        margin-top: 2px;
      }

      .modal-close {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: none;
        background: #E8F2ED;
        color: #999;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        transition: background 0.2s;
      }

      .modal-close:hover {
        background: #D4E6DC;
      }

      .count-hint {
        font-size: 13px;
        color: var(--text-mid);
        text-align: center;
        margin-bottom: 16px;
      }

      .count-control {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-bottom: 24px;
      }

      .count-btn {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-size: 18px;
        font-weight: 600;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .count-btn.minus {
        background: #EAF5F0;
        color: var(--primary);
      }

      .count-btn.minus:hover {
        background: var(--primary);
        color: white;
      }

      .count-btn.plus {
        background: var(--gradient-main);
        color: white;
      }

      .count-btn.plus:hover {
        transform: scale(1.1);
      }

      .count-display {
        font-size: 44px;
        font-weight: 800;
        color: var(--primary-dark);
        min-width: 64px;
        text-align: center;
      }

      .modal-actions {
        display: flex;
        gap: 10px;
      }

      .modal-actions button {
        flex: 1;
        padding: 12px;
        border-radius: 14px;
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-cancel {
        background: #EEF5F1;
        color: var(--text-mid);
      }

      .btn-confirm {
        background: var(--gradient-main);
        color: white;
      }

      .btn-confirm:hover {
        opacity: 0.9;
      }

      ::-webkit-scrollbar {
        width: 5px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(132, 203, 170, 0.25);
        border-radius: 10px;
      }
    </style>
    <style id="ep-styles">
      #ep-overlay {
        position: fixed;
        pointer-events: none;
        z-index: 2147483646;
        border: 1px dashed #000;
        background-color: rgba(92, 134, 243, 0.1);
        box-sizing: border-box;
        display: none;
        transition: all 0.05s ease-out;
      }

      #ep-label {
        position: fixed;
        pointer-events: none;
        z-index: 2147483646;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 4px 8px;
        border-radius: 3px;
        font-size: 12px;
        font-family: Menlo, Monaco, Consolas, monospace;
        white-space: nowrap;
        display: none;
      }

      #ep-label .tag {
        color: #e879f9;
      }

      #ep-label .id {
        color: #38bdf8;
      }

      #ep-label .class {
        color: #4ade80;
      }

      #ep-label .size {
        color: #94a3b8;
        margin-left: 8px;
      }

      /* 选中状态的高亮 */
      #ep-overlay.selected {
        border-color: #22c55e;
        background-color: rgba(34, 197, 94, 0.1);
      }
    </style>
  </head>
  <body>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay" id="editModal">
      <div class="modal-content">
        <div class="modal-head">
          <div>
            <div class="m-title" id="modalTitle">修改记录</div>
            <div class="m-date" id="modalDate"></div>
          </div>
          <button class="modal-close" onclick="closeModal()"><i class="fa fa-times"></i></button>
        </div>
        <div class="count-hint">🧋 这天喝了几杯？</div>
        <div class="count-control">
          <button class="count-btn minus" onclick="adjustModalCount(-1)"><i class="fa fa-minus"></i></button>
          <div class="count-display" id="modalCount">0</div>
          <button class="count-btn plus" onclick="adjustModalCount(1)"><i class="fa fa-plus"></i></button>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">取消</button>
          <button class="btn-confirm" onclick="saveModalCount()"><i class="fa fa-check" style="margin-right:4px;"></i>保存</button>
        </div>
      </div>
    </div>

    <!-- Hero Header -->
    <div style="background: var(--gradient-main); position: relative; overflow: hidden; padding: 36px 24px 28px;">
      <div style="position:absolute;top:-50%;right:-20%;width:400px;height:400px;background:rgba(255,255,255,0.08);border-radius:50%;"></div>
      <div style="position:absolute;bottom:-30%;left:-10%;width:300px;height:300px;background:rgba(255,255,255,0.06);border-radius:50%;"></div>
      <div style="max-width:520px;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">

    <script>
      const STORAGE_KEY = 'milktea_records_v2';
      let calendarYear, calendarMonth;
      let editingDateKey = '',
        editingCount = 0;

      function getData() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch (e) {
          return {};
        }
      }

      function saveData(d) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
      }

      function getDateKey(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return ${y}-${m}-${d};
      }

      function getToday() {
        return new Date();
      }

      function getTodayKey() {
        return getDateKey(getToday());
      }
      // ── 初始化
      function init() {
        const now = getToday();
        calendarYear = now.getFullYear();
        calendarMonth = now.getMonth();
        updateHeaderDate();
        updateTodayDisplay();
        updateStats();
        renderCalendar();
      }

      function updateHeaderDate() {
        const now = getToday();
        const wds = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const months = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];
        document.getElementById('headerDateStr').textContent =
          ${now.getFullYear()} 年 ${months[now.getMonth()]} 月 ${now.getDate()} 日  ${wds[now.getDay()]};
      }
      // ── 记录
      function recordDrink() {
        const data = getData();
        const key = getTodayKey();
        data[key] = (data[key] || 0) + 1;
        saveData(data);
        const btn = document.getElementById('mainRecordBtn');
        btn.classList.remove('animate-pop');
        void btn.offsetWidth;
        btn.classList.add('animate-pop');
        spawnEmoji(btn);
        updateTodayDisplay();
        updateStats();
        renderCalendar();
        showToast(🧋 今日已喝 ${data[key]} 杯！);
      }

      function spawnEmoji(btn) {
        const list = ['🧋', '☕', '✨', '🥤', '💕'];
        const rect = btn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        for (let i = 0; i < 3; i++) {
          setTimeout(() => {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.textContent = list[Math.floor(Math.random() * list.length)];
            el.style.left = (cx + (Math.random() - 0.5) * 60) + 'px';
            el.style.top = cy + 'px';
            el.style.transform = 'translate(-50%,-50%)';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1600);
          }, i * 110);
        }
      }

      function updateTodayDisplay() {
        const data = getData();
        const now = getToday();
        const todayKey = getTodayKey();
        const count = data[todayKey] || 0;
        // 今日杯数小卡片
        const statToday = document.getElementById('statTodayCount');
        if (statToday) statToday.textContent = count;
        // 三日内杯数（含今天）
        let threeDayTotal = 0;
        for (let i = 0; i < 3; i++) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          threeDayTotal += data[getDateKey(d)] || 0;
        }
        const stat3Day = document.getElementById('stat3DayCount');
        if (stat3Day) stat3Day.textContent = threeDayTotal;
      }
      // ── 统计
      function updateStats() {
        const data = getData();
        const now = getToday();
        const y = now.getFullYear();
        const mo = now.getMonth();
        // 本月：累计当月1日~今日所有记录
        let monthTotal = 0;
        for (const key in data) {
          const parts = key.split('-');
          const ky = parseInt(parts[0]);
          const km = parseInt(parts[1]) - 1;
          const kd = parseInt(parts[2]);
          const kDate = new Date(ky, km, kd);
          if (ky === y && km === mo && kDate <= now) {
            monthTotal += data[key];
          }
        }
        // 本周：从本周日到今日（不含未来）
        const dow = now.getDay();
        const wStart = new Date(now);
        wStart.setDate(now.getDate() - dow);
        wStart.setHours(0, 0, 0, 0);
        const wEnd = new Date(wStart);
        wEnd.setDate(wStart.getDate() + 6);
        let weekTotal = 0;
        for (let i = 0; i <= dow; i++) {
          const d = new Date(wStart);
          d.setDate(wStart.getDate() + i);
          weekTotal += data[getDateKey(d)] || 0;
        }
        document.getElementById('weekCount').textContent = weekTotal;
        const fmt = d => ${d.getMonth()+1}/${d.getDate()};
        document.getElementById('weekRange').textContent = ${fmt(wStart)} – ${fmt(wEnd)};
        // 本月卡片
        const todayStatEl = document.getElementById('todayStatCount');
        if (todayStatEl) todayStatEl.textContent = monthTotal;
        const todayDStr = document.getElementById('todayDateStr');
        if (todayDStr) todayDStr.textContent = ${now.getMonth()+1}月份;
      }

      function renderWeekBar(days) {
        const max = Math.max(...days.map(d => d.count), 1);
        const wrap = document.getElementById('weekBarChart');
        wrap.innerHTML = '';
        days.forEach(day => {
          const h = Math.max((day.count / max) * 64, day.count > 0 ? 8 : 4);
          const item = document.createElement('div');
          item.className = 'week-bar-item';
          item.innerHTML =             <div class="week-bar-count">${day.count > 0 ? day.count : ''}</div>             <div class="week-bar${day.isToday?' today-bar':''}" style="height:${h}px;"></div>             <div class="week-bar-label${day.isToday?' today-label':''}">${day.label}</div>          ;
          wrap.appendChild(item);
        });
      }
      // ── 日历：判断某日是否为"过去已过"（含今天之前）
      function isPastOrToday(dateObj, now) {
        const d = new Date(dateObj);
        d.setHours(0, 0, 0, 0);
        const t = new Date(now);
        t.setHours(0, 0, 0, 0);
        return d <= t;
      }
      // ── 日历
      function renderCalendar() {
        const data = getData();
        const now = getToday();
        const todayKey = getDateKey(now);
        document.getElementById('calMonthTitle').textContent = ${calendarYear}年${calendarMonth+1}月;
        // 月统计（只算过去+今天）
        let mTotal = 0,
          mDays = 0;
        for (const key in data) {
          const parts = key.split('-');
          const ky = parseInt(parts[0]);
          const km = parseInt(parts[1]) - 1;
          const kd = parseInt(parts[2]);
          const kDate = new Date(ky, km, kd);
          if (ky === calendarYear && km === calendarMonth && isPastOrToday(kDate, now)) {
            if (data[key] > 0) {
              mTotal += data[key];
              mDays++;
            }
          }
        }
        const calMonthSub = document.getElementById('calMonthSub');
        if (calMonthSub) calMonthSub.textContent = 共 ${mTotal} 杯 · ${mDays} 天有记录;
        // 下一月按钮
        const nb = document.getElementById('nextMonthBtn');
        const isCur = calendarYear === now.getFullYear() && calendarMonth === now.getMonth();
        nb.disabled = isCur;
        // 渲染格子
        const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
        const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
        const daysInPrev = new Date(calendarYear, calendarMonth, 0).getDate();
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        // 上月补位
        for (let i = 0; i < firstDay; i++) {
          const day = daysInPrev - firstDay + 1 + i;
          const cell = document.createElement('div');
          cell.className = 'calendar-day other-month';
          cell.innerHTML = <span class="day-num">${day}</span>;
          grid.appendChild(cell);
        }
        // 今天的前一天（用于判断"昨天"已过，今天可标绿）
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        yesterday.setHours(0, 0, 0, 0);
        // 本月每一天
        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(calendarYear, calendarMonth, d);
          const key = getDateKey(dateObj);
          const count = data[key] || 0;
          const isToday = key === todayKey;
          // 规范化比较
          const dateNorm = new Date(calendarYear, calendarMonth, d);
          dateNorm.setHours(0, 0, 0, 0);
          const todayNorm = new Date(now);
          todayNorm.setHours(0, 0, 0, 0);
          const isFuture = dateNorm > todayNorm;
          // 过去的日（严格小于今天）
          const isPast = dateNorm < todayNorm;
          const cell = document.createElement('div');
          let cls = 'calendar-day';
          if (isFuture) {
            cls += ' other-month';
          } else if (isToday) {
            // 今天：有记录则按杯数上色，没记录则只加 today 边框（不标绿）
            cls += ' today';
            if (count >= 3) cls += ' has-record-3';
            else if (count === 2) cls += ' has-record-2';
            else if (count === 1) cls += ' has-record-1';
            // count===0 今天不标绿，保留 today 边框样式即可
          } else {
            // 过去的日期
            if (count >= 3) cls += ' has-record-3';
            else if (count === 2) cls += ' has-record-2';
            else if (count === 1) cls += ' has-record-1';
            else cls += ' no-record'; // 过去0杯 → 淡绿
          }
          cell.className = cls;
          cell.innerHTML = <span class="day-num">${d}</span>${count > 0 ? <span class="day-count">${count}杯</span>` : ''}`;
          // 未来日期不可点击
          if (!isFuture) {
            cell.addEventListener('click', () => openEditModal(key, d, data[key] || 0));
          }
          grid.appendChild(cell);
        }
        // 下月补位
        const total = firstDay + daysInMonth;
        const rem = total % 7 === 0 ? 0 : 7 - (total % 7);
        for (let i = 1; i <= rem; i++) {
          const cell = document.createElement('div');
          cell.className = 'calendar-day other-month';
          cell.innerHTML = `<span class="day-num">${i}</span>`;
          grid.appendChild(cell);
        }
      }

      function changeMonth(delta) {
        calendarMonth += delta;
        if (calendarMonth < 0) {
          calendarMonth = 11;
          calendarYear--;
        }
        if (calendarMonth > 11) {
          calendarMonth = 0;
          calendarYear++;
        }
        const now = getToday();
        if (calendarYear > now.getFullYear() || (calendarYear === now.getFullYear() && calendarMonth > now.getMonth())) {
          calendarYear = now.getFullYear();
          calendarMonth = now.getMonth();
        }
        renderCalendar();
      }
      // ── 弹窗
      function openEditModal(key, day, count) {
        editingDateKey = key;
        editingCount = count;
        const p = key.split('-');
        document.getElementById('modalDate').textContent = ${p[0]}年${parseInt(p[1])}月${parseInt(p[2])}日;
        document.getElementById('modalTitle').textContent = count > 0 ? '修改记录' : '补充记录';
        document.getElementById('modalCount').textContent = editingCount;
        document.getElementById('editModal').classList.add('show');
      }

      function closeModal() {
        document.getElementById('editModal').classList.remove('show');
      }

      function adjustModalCount(d) {
        editingCount = Math.max(0, editingCount + d);
        document.getElementById('modalCount').textContent = editingCount;
      }

      function saveModalCount() {
        const data = getData();
        if (editingCount === 0) delete data[editingDateKey];
        else data[editingDateKey] = editingCount;
        saveData(data);
        closeModal();
        // 三项统一刷新，顺序不可颠倒
        updateTodayDisplay();
        updateStats();
        renderCalendar();
        const p = editingDateKey.split('-');
        const cup = editingCount === 0 ? '已清除记录' : 已更新为 ${editingCount} 杯;
        showToast(✅ ${parseInt(p[1])}月${parseInt(p[2])}日${cup});
      }
      // ── Toast
      let toastTimer = null;

      function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
      }
      document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
      });
      document.getElementById('shouldDrinkModal').addEventListener('click', function(e) {
        if (e.target === this) closeShouldDrink();
      });
      // ── 要不要喝逻辑（核心目标：劝阻所有用户，话术随严重程度递进）
      function showShouldDrink() {
        const data = getData();
        const now = getToday();
        const todayKey = getDateKey(now);
        // 今天已喝
        const todayCount = data[todayKey] || 0;
        // 本周已喝（含今天）
        const dow = now.getDay();
        let weekSoFar = 0;
        for (let i = 0; i <= dow; i++) {
          const d = new Date(now);
          d.setDate(now.getDate() - (dow - i));
          weekSoFar += data[getDateKey(d)] || 0;
        }
        // 近7天（不含今天）
        let recent7 = 0,
          recent7Days = 0;
        for (let i = 1; i <= 7; i++) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          const cnt = data[getDateKey(d)] || 0;
          recent7 += cnt;
          if (cnt > 0) recent7Days++;
        }
        // 近30天
        let recent30 = 0,
          recent30Days = 0;
        for (let i = 1; i <= 30; i++) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          const cnt = data[getDateKey(d)] || 0;
          recent30 += cnt;
          if (cnt > 0) recent30Days++;
        }
        // 连续未喝天数（从昨天往前数）
        let consecutiveFree = 0;
        for (let i = 1; i <= 60; i++) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          if ((data[getDateKey(d)] || 0) === 0) consecutiveFree++;
          else break;
        }
        // ── 话术策略（全部倾向劝阻，严重程度分5级）──
        let emoji, conclusion, reason, verdictBg, verdictColor, level;
        // Level 5：今天已喝2杯及以上 → 强烈劝阻
        if (todayCount >= 2) {
          level = 5;
          emoji = '🚨';
          conclusion = '停！今天已经够了';
          reason = 今天已经喝了 ${todayCount} 杯，这相当于摄入了约 ${todayCount * 60}g 糖。你的胰岛素正在超负荷工作，继续喝只会让下午更困、更想吃甜食——这是糖依赖的恶性循环。把杯子放下，喝杯白开水吧。;
          verdictBg = 'linear-gradient(135deg,#FFEAEA,#FFCFCF)';
          verdictColor = '#B71C1C';
        }
        // Level 4：今天已喝1杯 → 明确劝阻
        else if (todayCount === 1) {
          level = 4;
          emoji = '🛑';
          conclusion = '今天已经喝过了';
          reason = 今天已经有1杯记录了，已经打破了"零记录"的可能。现在停下，至少今天只有1杯。如果再来一杯，本周的糖分账单会很难看。忍住这一口，你会感谢自己的。;
          verdictBg = 'linear-gradient(135deg,#FFF3E0,#FFE0B2)';
          verdictColor = '#E65100';
        }
        // Level 3：本周已喝3杯及以上（今天未喝）→ 较强劝阻
        else if (weekSoFar >= 3) {
          level = 3;
          emoji = '⚠️';
          conclusion = 本周已经喝了 ${weekSoFar} 杯;
          reason = 营养学建议每周奶茶不超过1杯。你本周已经超额 ${weekSoFar - 1} 杯了，今天再喝只会让数字更难看。用一杯无糖绿茶代替，你不会损失任何快乐，但会少掉很多糖分。;
          verdictBg = 'linear-gradient(135deg,#FFF8E1,#FFECB3)';
          verdictColor = '#F57F17';
        }
        // Level 2：近7天喝了2天及以上（今天未喝，本周<3杯）→ 温和劝阻
        else if (recent7Days >= 2) {
          level = 2;
          emoji = '🤔';
          conclusion = '最近喝得有点频繁';
          reason = 近7天里有 ${recent7Days} 天都喝了奶茶，频率已经不低了。今天可以是一个"clean day"——不喝奶茶，喝什么都行。连续两天不喝，你会发现其实没那么离不开它。;
          verdictBg = 'linear-gradient(135deg,#FFF5F0,#FFE0CC)';
          verdictColor = '#BF360C';
        }
        // Level 1：今天没喝，近7天只喝了1天或没喝 → 鼓励坚持
        else {
          const streakDays = consecutiveFree + (todayCount === 0 ? 1 : 0);
          level = 1;
          if (streakDays >= 7) {
            emoji = '🏆';
            conclusion = 已经 ${streakDays} 天没喝了，别破功;
            reason = 你已经坚持了 ${streakDays} 天没有喝奶茶，这是了不起的成就！今天继续保持，让这个数字再大一点。破功只需要一秒，但重新开始要再等 ${streakDays} 天——值得吗？;
            verdictBg = 'linear-gradient(135deg,#E8F5E9,#C8E6C9)';
            verdictColor = '#1B5E20';
          } else if (streakDays >= 3) {
            emoji = '💪';
            conclusion = 坚持 ${streakDays} 天了，再忍忍;
            reason = 已经 ${streakDays} 天没有碰奶茶了，身体正在悄悄感谢你。就差一点点，把这个数字变得更好看。今天喝白开水、柠檬水或者淡茶，明天你会很自豪。;
            verdictBg = 'linear-gradient(135deg,#E8F5E9,#DCEDC8)';
            verdictColor = '#33691E';
          } else {
            emoji = '🌱';
            conclusion = '今天不喝，就从今天开始';
            reason = 今天还没有记录，这是一个好机会——让今天成为"零糖日"。每少喝一杯奶茶，就少摄入约500千卡和60g糖。不需要节食，只是把这一杯换成白开水，就够了。;
            verdictBg = 'linear-gradient(135deg,#F1F8E9,#DCEDC8)';
            verdictColor = '#558B2F';
          }
        }
        // 填充弹窗
        document.getElementById('sdEmoji').textContent = emoji;
        document.getElementById('sdConclusion').textContent = conclusion;
        document.getElementById('sdConclusion').style.color = verdictColor;
        document.getElementById('sdReason').textContent = reason;
        const vd = document.getElementById('sdVerdict');
        vd.style.background = verdictBg;
        // 统计小卡片
        const statsEl = document.getElementById('sdStats');
        statsEl.innerHTML =           <div style="background:#F2FAF6;border-radius:12px;padding:12px 8px;text-align:center;">             <div style="font-size:22px;font-weight:800;color:var(--primary);">${todayCount}</div>             <div style="font-size:10px;color:var(--text-light);margin-top:3px;">今日已喝</div>           </div>           <div style="background:#FFF5F0;border-radius:12px;padding:12px 8px;text-align:center;">             <div style="font-size:22px;font-weight:800;color:var(--accent);">${weekSoFar}</div>             <div style="font-size:10px;color:var(--text-light);margin-top:3px;">本周累计</div>           </div>           <div style="background:#EFF8F3;border-radius:12px;padding:12px 8px;text-align:center;">             <div style="font-size:22px;font-weight:800;color:var(--success);">${consecutiveFree}</div>             <div style="font-size:10px;color:var(--text-light);margin-top:3px;">连续未喝天数</div>           </div>        ;
        document.getElementById('sdSubtitle').textContent =
          近30天共喝 ${recent30} 杯 · 饮茶 ${recent30Days} 天;
        document.getElementById('shouldDrinkModal').classList.add('show');
      }

      function closeShouldDrink() {
        document.getElementById('shouldDrinkModal').classList.remove('show');
      }
      // 按钮 hover 效果
      const sdb = document.getElementById('shouldDrinkBtn');
      sdb.addEventListener('mouseenter', () => {
        sdb.style.transform = 'scale(1.03)';
        sdb.style.boxShadow = '0 10px 32px rgba(255,171,139,0.45)';
      });
      sdb.addEventListener('mouseleave', () => {
        sdb.style.transform = 'scale(1)';
        sdb.style.boxShadow = '0 4px 18px rgba(255,171,139,0.35)';
      });
      const rdb = document.getElementById('mainRecordBtn');
      rdb.addEventListener('mouseenter', () => {
        rdb.style.transform = 'scale(1.03)';
        rdb.style.boxShadow = '0 10px 32px rgba(132, 203, 170, 0.4)';
      });
      rdb.addEventListener('mouseleave', () => {
        rdb.style.transform = 'scale(1)';
        rdb.style.boxShadow = '0 4px 18px rgba(132, 203, 170, 0.35)';
      });
      init();
    </script>

    <div id="ep-overlay"></div>
    <div id="ep-label"></div>

  </body>
</html>
